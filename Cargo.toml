[package]
name = "hyper"
version = "0.4.0"
edition = "2021"
authors = ["Geir Isene <g@isene.com>"]
description = "Terminal viewer and editor for the HyperList outline format. Rust feature port of the Ruby HyperList TUI."
license = "Unlicense"
repository = "https://github.com/isene/hyper"

[dependencies]
crust = { version = "0.1", path = "../crust", package = "fe2o3-crust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[profile.release]
opt-level = 3
lto = true
